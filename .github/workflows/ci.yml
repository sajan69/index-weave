name: Verify
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: ruff check . && ruff format --check .
      - name: Check formatting
        run: |
          if ! npm run format:check; then
            npm run format
            git diff --exit-code
            exit 1
          fi
      - run: npm run links
      - run: npm run lint && npm run typecheck && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: src/indexweave/web
          retention-days: 7
  storage:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/indexweave/web
      - run: python -m build --wheel --no-isolation
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: pip check
      - run: python -m unittest discover -s tests -v
      - run: indexweave --version
      - name: Run the synthetic storage example
        run: |
          mkdir -p artifacts
          python examples/storage_demo.py > artifacts/storage-demo.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("artifacts/storage-demo.json").read_text())
          recorded = json.loads(Path("examples/storage-demo.json").read_text())["result"]
          assert actual == recorded, "Synthetic storage output differs from the recorded format fixture"
          print("STORAGE_DEMO=" + json.dumps(actual, sort_keys=True))
          PY
      - name: Run the synthetic lexical search example
        run: |
          python examples/search_demo.py > artifacts/search-demo.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/search-demo.json").read_text())
          assert result["completed"] and result["old_index_unchanged"]
          assert result["deleted_and_replaced_terms_absent"]
          print("SEARCH_DEMO=" + json.dumps({
              "completed": result["completed"],
              "initial_index": result["initial_index"],
              "current_index": result["current_index"],
              "queries": [{"query": q["query"], "ids": [h["id"] for h in q["hits"]]} for q in result["queries"]],
          }, sort_keys=True))
          PY
      - name: Run the synthetic persistent segment example
        run: |
          python examples/segments_demo.py > artifacts/segments-demo.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/segments-demo.json").read_text())
          assert result["completed"] and result["generations"] == [1, 2, 3]
          assert result["segment_counts"] == [1, 2, 1]
          assert result["removed_files"] == 2 and result["source_log_unchanged"]
          print("SEGMENTS_DEMO=" + json.dumps(result, sort_keys=True))
          PY
      - name: Run the source checkpoint compaction example
        run: |
          python examples/compaction_demo.py > artifacts/compaction-demo.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/compaction-demo.json").read_text())
          assert result["completed"] and result["source_unchanged"]
          assert result["compaction"]["revision"] == 7
          assert result["target_revision_after_append"] == 8
          assert result["preserved_document_revisions"] == {"guide": 7, "keep": 1}
          print("COMPACTION_DEMO=" + json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: storage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/storage-demo.json
            artifacts/search-demo.json
            artifacts/segments-demo.json
            artifacts/compaction-demo.json
            dist/*.whl
          retention-days: 7

  retrieval-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . -r requirements-data.txt
      - run: pip check
      - run: mkdir -p artifacts
      - run:
          python scripts/audit_retrieval_sources.py
          artifacts/retrieval-audit.json
      - run: python scripts/prepare_retrieval_data.py artifacts/retrieval-data
      - name: Verify the frozen projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("artifacts/retrieval-data/summary.json").read_text())
          expected = json.loads(Path("examples/retrieval-data.json").read_text())["result"]
          assert actual == expected, "Public-data projection differs from the frozen record"
          print("Frozen projection and 200 split IDs verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-source-audit
          path: |
            artifacts/retrieval-audit.json
            artifacts/retrieval-data/summary.json
          retention-days: 7

  semantic:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-data.txt
      - run:
          pip install torch==2.15.0 --index-url
          https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-semantic.txt
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/indexweave/web
      - run: python -m build --wheel --no-isolation
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: pip check
      - run: python -m unittest discover -s tests -v
      - run: mkdir -p artifacts
      - name: Acquire the pinned public model explicitly
        run:
          indexweave model-fetch artifacts/minilm >
          artifacts/model-verified.json
      - name: Exercise actual offline inference and installed CLI
        run: python examples/semantic_demo.py artifacts/minilm
      - run: pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the browser with the real local model
        run: python tests/browser_workflow.py --model artifacts/minilm
      - name: Prepare the frozen public corpus
        run: python scripts/prepare_retrieval_data.py artifacts/evaluation-data
      - name: Run the fixed retrieval comparison
        run:
          python scripts/evaluate_retrieval.py artifacts/evaluation-data
          artifacts/minilm artifacts/retrieval-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-cpu
          path: |
            artifacts/retrieval-evaluation.json
            artifacts/model-verified.json
            artifacts/browser/
            artifacts/minilm/MODEL-MANIFEST.json
            artifacts/evaluation-data/summary.json
          retention-days: 7

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt playwright==1.64.1
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/indexweave/web
      - run: python -m build --wheel --no-isolation
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: pip check
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_workflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexweave-browser
          path: artifacts/browser
          retention-days: 7
